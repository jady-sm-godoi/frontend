<meta charset="utf-8" />
<meta
	name="viewport"
	content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>
<meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1" />
<title>@@title</title>
<meta name="description" content="@@description" />

<link rel="canonical" href="@@canonicalUrl" />
<meta
	name="google-site-verification"
	content="ydwh2aK3KPNg2gwIqmRu5qUJyja6elubXMifsviXw6I"
/>

<!-- Open Graph Metas -->
<meta property="og:url" content="@@canonicalUrl" />
<meta property="og:description" content="@@description" />
<meta property="og:type" content="@@ogType" />
<meta property="og:locale" content="@@ogLocale" />
<meta property="og:image" content="@@ogImage" />
<meta property="og:image:type" content="@@ogImageType" />
<meta property="og:image" width="@@ogImageWidth" />
<meta property="og:image" height="@@ogImageHeight" />

<!-- Twitter Metas -->
<meta name="twitter:card" content="@@twitterCard" />
<meta name="twitter:site" content="@@twitterSite" />
<meta name="twitter:creator" content="@@twitterCreator" />
<meta name="twitter:url" content="@@canonicalUrl" />
<meta name="twitter:domain" content="@@twitterDomain" />
<meta name="twitter:title" content="@@title" />
<meta name="twitter:description" content="@@description" />
<meta name="twitter:image" content="@@ogImage" />
<meta name="twitter:image:alt" content="@@title" />

<!-- Google Fonts API -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- // Google Fonts API -->

<!-- Generics favicons -->
<link rel="icon" href="assets/favicon/favicon-32.png" sizes="32x32" />
<link rel="icon" href="assets/favicon/favicon-57.png" sizes="57x57" />
<link rel="icon" href="assets/favicon/favicon-76.png" sizes="76x76" />
<link rel="icon" href="assets/favicon/favicon-96.png" sizes="96x96" />
<link rel="icon" href="assets/favicon/favicon-128.png" sizes="128x128" />
<link rel="icon" href="assets/favicon/favicon-192.png" sizes="192x192" />
<link rel="icon" href="assets/favicon/favicon-228.png" sizes="228x228" />
<!-- // Generics favicons -->

<!-- Android favicons -->
<link
	rel="shortcut icon"
	sizes="196x196"
	href="assets/favicon/favicon-196.png"
/>
<!-- // Android favicons -->

<!-- iOS favicons -->
<link
	rel="apple-touch-icon"
	href="assets/favicon/favicon-152.png"
	sizes="152x152"
/>
<link
	rel="apple-touch-icon"
	href="assets/favicon/favicon-120.png"
	sizes="120x120"
/>
<link
	rel="apple-touch-icon"
	href="assets/favicon/favicon-180.png"
	sizes="180x180"
/>
<meta name="theme-color" content="#5E010D" />
<!-- // iOS favicons -->

<!-- Open Sans (Google Fonts) -->
<link
	href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap"
	rel="stylesheet"
/>
<!-- // Open Sans (Google Fonts) -->

<!-- CSS -->
<link rel="stylesheet" href="styles/main.css" />
<!--// CSS -->

<script type="text/javascript" defer src="scripts/main.js"></script>
